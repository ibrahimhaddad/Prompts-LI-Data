<title>LinkedIn Network — Company Clusters</title>
<style>
  :root{
    --surface: #161a22;
    --surface-2: #1d2330;
    --panel-border: rgba(255,255,255,0.08);
    --ink: #f2f3f5;
    --ink-secondary: #b7bcc7;
    --ink-muted: #7d8394;
    --accent-ring: #f4c452;
    --other-color: #6b7280;
    --link-color: #4a5063;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  header{
    padding: 14px 20px 10px 20px;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink:0;
  }
  h1{
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .stats-row{
    display:flex;
    gap: 22px;
    flex-wrap: wrap;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stat .val{
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl{
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .main{
    flex: 1;
    display:flex;
    min-height:0;
  }
  #canvas-wrap{
    flex: 1;
    position: relative;
    min-width:0;
  }
  svg{
    display:block;
    width:100%;
    height:100%;
    background: var(--surface);
  }
  aside{
    width: 260px;
    flex-shrink:0;
    border-left: 1px solid var(--panel-border);
    background: var(--surface-2);
    overflow-y: auto;
    padding: 12px 0;
  }
  .legend-title{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    padding: 4px 16px 8px 16px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 5px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s;
  }
  .legend-item:hover{
    background: rgba(255,255,255,0.04);
  }
  .legend-item.active{
    border-left-color: var(--accent-ring);
    background: rgba(255,255,255,0.06);
  }
  .legend-swatch{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink:0;
  }
  .legend-rank{
    font-size: 11px;
    color: var(--ink-muted);
    width: 16px;
    flex-shrink:0;
    font-variant-numeric: tabular-nums;
  }
  .legend-name{
    font-size: 12.5px;
    color: var(--ink-secondary);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .legend-count{
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
  }
  .caption{
    padding: 8px 16px 4px 16px;
    font-size: 11px;
    color: var(--ink-muted);
    line-height: 1.5;
    border-top: 1px solid var(--panel-border);
    margin-top: 8px;
  }
  .tooltip{
    position: absolute;
    pointer-events: none;
    background: #0d1017;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12.5px;
    color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
    max-width: 240px;
  }
  .tooltip .t-title{
    font-weight: 600;
    margin-bottom: 2px;
  }
  .tooltip .t-sub{
    color: var(--ink-secondary);
    font-size: 11.5px;
  }
  .reset-btn{
    position:absolute;
    top:10px;
    left:10px;
    background: rgba(29,35,48,0.85);
    border: 1px solid var(--panel-border);
    color: var(--ink-secondary);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .reset-btn.visible{
    opacity: 1;
    pointer-events: auto;
  }
  .reset-btn:hover{
    background: rgba(29,35,48,1);
  }
  .hint{
    position:absolute;
    bottom:10px;
    left:10px;
    font-size: 11px;
    color: var(--ink-muted);
    background: rgba(22,26,34,0.7);
    padding: 4px 8px;
    border-radius: 4px;
  }
</style>

<header>
  <h1>My LinkedIn Network — Company Clusters</h1>
  <div class="stats-row">
    <div class="stat"><span class="val" id="stat-total">—</span><span class="lbl">Total connections</span></div>
    <div class="stat"><span class="val" id="stat-companies">—</span><span class="lbl">Distinct companies</span></div>
    <div class="stat"><span class="val" id="stat-largest">—</span><span class="lbl">Largest cluster</span></div>
    <div class="stat"><span class="val" id="stat-other">—</span><span class="lbl">Outside top 20 ("Other")</span></div>
  </div>
</header>

<div class="main">
  <div id="canvas-wrap">
    <svg id="viz"></svg>
    <button class="reset-btn" id="reset-btn">Reset view</button>
    <div class="hint">Drag nodes · scroll/pinch to zoom · click a hub to isolate · click empty space to reset</div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <aside>
    <div class="legend-title">Top 20 clusters (rank · count)</div>
    <div id="legend"></div>
    <div class="caption" id="caption"></div>
  </aside>
</div>

<script>
/*__D3_JS__*/
</script>

<script>
const DATA = /*__DATA_JSON__*/;

const HUB_COLORS = [
  "#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f",
  "#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac",
  "#17becf","#f1ce63","#d37295","#8cd17d","#b6992d",
  "#499894","#e0a891","#a0cbe8","#79706e","#d4a6c8"
];
const OTHER_COLOR = "#6b7280";
const CENTER_COLOR = "#f4c452";

const colorByHub = new Map();
DATA.top20.forEach((d, i) => colorByHub.set(d.label, HUB_COLORS[i % HUB_COLORS.length]));

document.getElementById("stat-total").textContent = DATA.total.toLocaleString();
document.getElementById("stat-companies").textContent = DATA.distinctCompanies.toLocaleString();
document.getElementById("stat-largest").textContent = DATA.largest.label + " (" + DATA.largest.count + ")";
document.getElementById("stat-other").textContent = DATA.otherCount.toLocaleString() + " people";

const legendEl = document.getElementById("legend");
DATA.top20.forEach(d => {
  const row = document.createElement("div");
  row.className = "legend-item";
  row.dataset.hub = d.label;
  row.innerHTML = `<span class="legend-rank">${d.rank}</span>` +
    `<span class="legend-swatch" style="background:${colorByHub.get(d.label)}"></span>` +
    `<span class="legend-name" title="${d.label.replace(/"/g,'&quot;')}">${d.label}</span>` +
    `<span class="legend-count">${d.count}</span>`;
  legendEl.appendChild(row);
});
const otherRow = document.createElement("div");
otherRow.className = "legend-item";
otherRow.dataset.hub = "Other";
otherRow.innerHTML = `<span class="legend-rank">21</span>` +
  `<span class="legend-swatch" style="background:${OTHER_COLOR}"></span>` +
  `<span class="legend-name">Other (below top 20)</span>` +
  `<span class="legend-count">${DATA.otherCount}</span>`;
legendEl.appendChild(otherRow);

document.getElementById("caption").textContent = DATA.capApplied
  ? `The top 20 clusters total ${DATA.top20Sum} people, above the ~1,500-person threshold, so each hub is capped at 40 individually-drawn leaves to keep the graph readable and fast. The ${DATA.otherCount} connections outside the top 20 are rolled into a single "Other" hub without individual leaves.`
  : `All ${DATA.top20Sum} people in the top 20 clusters are drawn as individual leaf nodes — under the ~1,500-person threshold, so no per-hub cap was needed. The ${DATA.otherCount} connections outside the top 20 are rolled into a single "Other" hub without individual leaves, to keep the graph readable.`;

const svg = d3.select("#viz");
const wrap = document.getElementById("canvas-wrap");
let width = wrap.clientWidth, height = wrap.clientHeight;

const g = svg.append("g");
const linkLayer = g.append("g").attr("class", "links");
const nodeLayer = g.append("g").attr("class", "nodes");

const zoom = d3.zoom()
  .scaleExtent([0.15, 6])
  .on("zoom", (event) => { g.attr("transform", event.transform); });
svg.call(zoom);

const radiusScale = d3.scaleSqrt()
  .domain([0, d3.max(DATA.nodes, d => d.count || 0)])
  .range([7, 46]);

function nodeRadius(d){
  if(d.type === "center") return 20;
  if(d.type === "hub" || d.type === "other") return radiusScale(d.count);
  return 4.2;
}
function nodeColor(d){
  if(d.type === "center") return CENTER_COLOR;
  if(d.type === "other") return OTHER_COLOR;
  if(d.type === "hub") return colorByHub.get(d.name);
  return colorByHub.get(d.hub) || OTHER_COLOR;
}
function nodeStroke(d){
  if(d.type === "center") return "#fff8e1";
  return "rgba(255,255,255,0.35)";
}

const nodes = DATA.nodes.map(d => ({...d}));
const links = DATA.links.map(d => ({...d}));

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(l => {
      if(l.source.type === "center" || l.target.type === "center") return 220;
      return 26;
    })
    .strength(l => (l.source.type === "center" || l.target.type === "center") ? 0.35 : 0.9))
  .force("charge", d3.forceManyBody().strength(d => {
    if(d.type === "center") return -1200;
    if(d.type === "hub" || d.type === "other") return -260;
    return -12;
  }))
  .force("collide", d3.forceCollide().radius(d => nodeRadius(d) + 1.5).strength(0.9))
  .force("center", d3.forceCenter(width/2, height/2))
  .alphaDecay(0.02);

const link = linkLayer.selectAll("line")
  .data(links)
  .join("line")
  .attr("stroke", d => {
    const t = d.target;
    if(t.type === "leaf") return colorByHub.get(t.hub) || OTHER_COLOR;
    if(t.type === "other") return OTHER_COLOR;
    return colorByHub.get(t.name) || "var(--link-color)";
  })
  .attr("stroke-opacity", d => d.target.type === "leaf" ? 0.22 : 0.35)
  .attr("stroke-width", d => d.target.type === "leaf" ? 1 : 1.6);

const node = nodeLayer.selectAll("g.node")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

node.each(function(d){
  const sel = d3.select(this);
  if(d.type === "center"){
    sel.append("path")
      .attr("d", d3.symbol().type(d3.symbolStar).size(900)())
      .attr("fill", nodeColor(d))
      .attr("stroke", nodeStroke(d))
      .attr("stroke-width", 2.5);
  } else {
    sel.append("circle")
      .attr("r", nodeRadius(d))
      .attr("fill", nodeColor(d))
      .attr("stroke", nodeStroke(d))
      .attr("stroke-width", d.type === "leaf" ? 0.6 : 1.4)
      .attr("fill-opacity", d.type === "leaf" ? 0.9 : 1);
  }
});

node.filter(d => d.type === "hub" || d.type === "other" || d.type === "center")
  .append("text")
  .text(d => d.type === "center" ? "Me" : d.name)
  .attr("text-anchor", "middle")
  .attr("dy", d => nodeRadius(d) + 12)
  .attr("fill", "#f2f3f5")
  .attr("font-size", d => d.type === "center" ? 12 : 10.5)
  .attr("font-weight", d => d.type === "center" ? 700 : 600)
  .attr("pointer-events", "none")
  .style("paint-order", "stroke")
  .style("stroke", "#161a22")
  .style("stroke-width", "3px");

const tooltip = document.getElementById("tooltip");
const wrapRect = () => wrap.getBoundingClientRect();

node.on("mousemove", (event, d) => {
    const r = wrapRect();
    const x = event.clientX - r.left;
    const y = event.clientY - r.top;
    let title, sub;
    if(d.type === "center"){
      title = "Me";
      sub = DATA.total.toLocaleString() + " total connections";
    } else if(d.type === "hub"){
      title = d.name;
      sub = `Rank #${d.rank} · ${d.count} connection${d.count===1?"":"s"} (${(d.count/DATA.total*100).toFixed(1)}%)`;
    } else if(d.type === "other"){
      title = "Other";
      sub = `${d.count} connections outside the top 20 companies`;
    } else {
      title = d.name;
      sub = (d.position || "Position not listed") + " · " + d.hub;
    }
    tooltip.innerHTML = `<div class="t-title">${title}</div><div class="t-sub">${sub}</div>`;
    tooltip.style.opacity = 1;
    let left = x + 14, top = y + 10;
    if(left + 240 > r.width) left = x - 254;
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  })
  .on("mouseleave", () => { tooltip.style.opacity = 0; });

let activeHub = null;
const resetBtn = document.getElementById("reset-btn");

function applyHighlight(hubName){
  activeHub = hubName;
  resetBtn.classList.toggle("visible", !!hubName);
  document.querySelectorAll(".legend-item").forEach(el => {
    el.classList.toggle("active", hubName && el.dataset.hub === hubName);
  });
  if(!hubName){
    node.attr("opacity", 1);
    link.attr("opacity", 1);
    return;
  }
  node.attr("opacity", d => {
    if(d.type === "center") return 1;
    if(d.type === "hub" || d.type === "other") return d.name === hubName ? 1 : 0.15;
    return d.hub === hubName ? 1 : 0.08;
  });
  link.attr("opacity", l => {
    const t = l.target;
    if(t.type === "hub" || t.type === "other") return t.name === hubName ? 1 : 0.08;
    return t.hub === hubName ? 0.55 : 0.03;
  });
}

node.on("click", (event, d) => {
  event.stopPropagation();
  if(d.type === "hub" || d.type === "other"){
    applyHighlight(activeHub === d.name ? null : d.name);
  }
});
svg.on("click", () => applyHighlight(null));
resetBtn.addEventListener("click", () => applyHighlight(null));

document.querySelectorAll(".legend-item").forEach(el => {
  el.addEventListener("click", () => {
    const hub = el.dataset.hub;
    applyHighlight(activeHub === hub ? null : hub);
  });
});

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragstarted(event, d){
  if(!event.active) simulation.alphaTarget(0.25).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d){
  d.fx = event.x; d.fy = event.y;
}
function dragended(event, d){
  if(!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

window.addEventListener("resize", () => {
  width = wrap.clientWidth; height = wrap.clientHeight;
  simulation.force("center", d3.forceCenter(width/2, height/2));
  simulation.alpha(0.3).restart();
});
</script>
